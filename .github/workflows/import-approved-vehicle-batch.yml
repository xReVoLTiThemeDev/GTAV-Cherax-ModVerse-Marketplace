name: Import approved ModVerse vehicle batch
on:
  push:
    branches: [main]
    paths:
      - 'marketplace/vehicles/inbox/modverse-approved-119.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: modverse-approved-vehicles-publish
  cancel-in-progress: false
jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Import and SHA-verify batch
        run: python3 scripts/import_approved_vehicle_batch.py
      - name: Validate the final public catalog
        run: python3 scripts/validate_vehicles_catalog.py
      - name: Commit approved assets and updated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- marketplace/vehicles
          if git diff --cached --quiet; then
            echo 'Catalog already current; nothing to commit.'
            exit 0
          fi
          git commit -m 'Publish SHA-verified ModVerse vehicle batch (119 creator-approved submissions)'
          git push origin HEAD:main
