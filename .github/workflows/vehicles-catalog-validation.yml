name: Validate ModVerse Marketplace Catalogs

on:
  push:
    paths:
      - 'marketplace/vehicles/**'
      - 'marketplace/outfits/**'
      - 'marketplace/dlcs/**'
      - 'scripts/validate_cherax_assets.py'
      - 'scripts/validate_vehicles_catalog.py'
      - '.github/workflows/vehicles-catalog-validation.yml'
  pull_request:
    paths:
      - 'marketplace/vehicles/**'
      - 'marketplace/outfits/**'
      - 'marketplace/dlcs/**'
      - 'scripts/validate_cherax_assets.py'
      - 'scripts/validate_vehicles_catalog.py'
      - '.github/workflows/vehicles-catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate vehicle manifest and SHA-256 hashes
        run: python scripts/validate_vehicles_catalog.py
      - name: Validate Cherax outfit and DLC catalogs
        run: python scripts/validate_cherax_assets.py
